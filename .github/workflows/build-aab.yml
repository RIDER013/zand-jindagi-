name: Build Android AAB (App Bundle)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-aab:
    name: Build Android App Bundle (.aab)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Accept Android SDK Licenses & Install Components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Build Android App Bundle (AAB)
        run: ./gradlew bundleDebug --info --stacktrace --no-daemon

      - name: Upload AAB Artifact for Play Store
        uses: actions/upload-artifact@v4
        with:
          name: RiderAssistant-debug.aab
          path: app/build/outputs/bundle/debug/app-debug.aab
          retention-days: 30

      - name: Upload Play Store 512x512 Icon
        uses: actions/upload-artifact@v4
        with:
          name: playstore_icon_512.png
          path: public/playstore_icon_512.png
          retention-days: 30

