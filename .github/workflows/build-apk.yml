name: Build Android APK (ZAND JINDAGI)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build ZAND JINDAGI APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Accept Android SDK Licenses & Install Components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Build APK with Gradle
        run: |
          ./gradlew assembleDebug --info --stacktrace --no-daemon
          mkdir -p output_apk
          cp app/build/outputs/apk/debug/app-debug.apk output_apk/ZAND_JINDAGI.apk

      - name: Upload ZAND JINDAGI APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZAND_JINDAGI.apk
          path: output_apk/ZAND_JINDAGI.apk
          retention-days: 30
