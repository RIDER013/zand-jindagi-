name: Build Native Android App (AAB & APK)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-native:
    name: Build Native ZAND JINDAGI (APK & AAB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Web Preview Assets
        run: |
          npm ci || npm install
          npm run build
          mkdir -p app/src/main/assets/www
          cp -r dist/* app/src/main/assets/www/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Accept Android SDK Licenses & Install SDK Components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Build Native Android APK and AAB (.abb)
        run: |
          ./gradlew assembleDebug bundleDebug --info --stacktrace --no-daemon
          mkdir -p native_outputs
          cp app/build/outputs/apk/debug/app-debug.apk native_outputs/ZAND_JINDAGI.apk
          cp app/build/outputs/bundle/debug/app-debug.aab native_outputs/ZAND_JINDAGI.aab

      - name: Upload Native APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZAND_JINDAGI-apk
          path: native_outputs/ZAND_JINDAGI.apk
          retention-days: 30

      - name: Upload Native AAB (.abb) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZAND_JINDAGI-aab
          path: native_outputs/ZAND_JINDAGI.aab
          retention-days: 30
